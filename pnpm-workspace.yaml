packages:
  - functions
overrides:
  uuid: ">=11.1.1"
allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  re2: true
  unrs-resolver: true
  onlyBuiltDependencies:
    - re2
  # Its only build step prints a funding notice; jsPDF ships its
  # own polyfills and does not need it to run.
  core-js: false

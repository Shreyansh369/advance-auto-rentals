  "source-map-js@<1.2.2": "^1.2.2"
  "sharp@<0.35.5": "^0.35.5"
  "re2js@<2.8.7": "^2.8.7"
  "body-parser@<1.20.9": "~1.20.9"
  "proxy-addr@<2.0.8": "^2.0.8"
  "qs@<6.16.1": "^6.16.1"
  "@fastify/busboy@<3.2.2": "^3.2.2"
allowBuilds:
